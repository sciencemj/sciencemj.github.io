<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Project editor · Portfolio admin</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      var initialTheme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", initialTheme);
    } catch (error) {}
  </script>
  <script defer src="/admin/editor-model.js"></script>
  <script defer src="/admin/image-processor.js"></script>
  <script defer src="/admin/editor-view.js"></script>
  <script defer src="/admin/admin.js"></script>
</head>
<body>
  <header class="command-bar" id="command-bar">
    <div class="command-inner">
      <a class="brand" href="/" aria-label="Portfolio admin home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span><strong>Project editor</strong><small id="owner-sub">portfolio admin</small></span>
      </a>
      <div class="save-state" id="dirty-indicator"><span></span><span>All changes saved</span></div>
      <div class="command-actions">
        <button class="icon-button" type="button" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme"><span aria-hidden="true">◐</span></button>
        <button class="button button-secondary" type="button" id="commit-btn">Commit &amp; push</button>
        <button class="button button-primary" type="button" id="save-btn" disabled>Save changes</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="editor-intro" aria-labelledby="page-title">
      <div>
        <span class="eyebrow">LOCAL EDITOR / CURATED PROJECTS</span>
        <h1 id="page-title">Shape every public project card.</h1>
      </div>
      <div class="change-summary" id="change-summary" aria-label="Pending change summary"></div>
    </section>

    <div class="editor-grid">
      <aside class="master-panel" aria-labelledby="projects-title">
        <div class="panel-heading">
          <div><span class="eyebrow">ORDER CONTROLS DISPLAY</span><h2 id="projects-title">Projects <span id="project-count">0</span></h2></div>
          <button class="text-button" type="button" id="add-project-btn">+ Add project</button>
        </div>
        <label class="search-field">
          <span class="sr-only">Search projects</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="project-search" type="search" placeholder="Find a repository…" autocomplete="off">
        </label>
        <div class="project-list" id="project-list"></div>
        <p class="list-note">Order here becomes order on public portfolio. Arrow controls work with keyboard.</p>
      </aside>

      <section class="inspector-panel" id="project-inspector" aria-label="Selected project editor"></section>
    </div>

    <section class="gitlog" id="gitlog" aria-label="Git command output" hidden></section>
  </main>

  <dialog class="repository-dialog" id="add-project-dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-frame">
      <header><div><span class="eyebrow">GITHUB REPOSITORIES</span><h2 id="dialog-title">Add a project</h2></div><button class="icon-button" value="cancel" aria-label="Close dialog">×</button></header>
      <label class="search-field"><span class="sr-only">Search GitHub repositories</span><input id="repo-search" type="search" placeholder="Search by name, description, or language…"></label>
      <div class="repository-list" id="repository-list"><p class="empty-state">Loading repositories…</p></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <div class="sr-only" id="status-live" aria-live="polite"></div>
  <div class="sr-only" id="error-live" aria-live="assertive"></div>
</body>
</html>
