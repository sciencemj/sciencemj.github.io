<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8b0bc"/>
    </marker>
    <marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D95F1E"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="12" fill="#fbfaf7"/>

  <text x="36" y="36" font-size="12.5" font-weight="700" fill="#a8b0bc" letter-spacing="1">FORWARD  →</text>
  <text x="828" y="36" font-size="12.5" font-weight="700" fill="#D95F1E" letter-spacing="1">←  BACKWARD</text>

  <!-- forward arrows (faded) -->
  <g stroke="#a8b0bc" stroke-width="1.4" fill="none" marker-end="url(#fw)">
    <line x1="102" y1="105" x2="152" y2="105"/>
    <line x1="212" y1="105" x2="322" y2="105"/>
    <line x1="382" y1="105" x2="500" y2="105"/>
    <line x1="560" y1="105" x2="676" y2="105"/>
    <line x1="736" y1="105" x2="836" y2="105"/>
    <line x1="126" y1="176" x2="166" y2="132"/>
    <line x1="316" y1="176" x2="352" y2="132"/>
  </g>

  <!-- forward edge labels -->
  <g font-size="13" font-style="italic" fill="#8b93a0" text-anchor="middle">
    <text x="267" y="94">Wx</text>
    <text x="441" y="94">z</text>
    <text x="618" y="94">ŷ</text>
  </g>

  <!-- nodes -->
  <g text-anchor="middle" font-size="15" font-style="italic">
    <rect x="38" y="86" width="62" height="38" rx="9" fill="#DFF2EA" stroke="#177E5B" stroke-width="1.8"/><text x="69" y="111" fill="#1e2430">W</text>
    <rect x="84" y="160" width="80" height="34" rx="9" fill="#E3EAFB" stroke="#3056C8"/><text x="124" y="183" fill="#1e2430" font-size="13">x</text>
    <rect x="276" y="160" width="80" height="34" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="316" y="183" fill="#a8b0bc" font-size="13">b</text>

    <circle cx="182" cy="105" r="30" fill="#fff" stroke="#5a6472" stroke-width="1.8"/><text x="182" y="112" fill="#1e2430">×</text>
    <circle cx="352" cy="105" r="30" fill="#fff" stroke="#5a6472" stroke-width="1.8"/><text x="352" y="112" fill="#1e2430">+</text>
    <circle cx="530" cy="105" r="30" fill="#fff" stroke="#5a6472" stroke-width="1.8"/><text x="530" y="112" fill="#1e2430">σ</text>
    <circle cx="706" cy="105" r="30" fill="#fff" stroke="#5a6472" stroke-width="1.8"/><text x="706" y="111" font-size="13" font-style="normal" fill="#1e2430">Loss</text>
    <rect x="840" y="84" width="66" height="42" rx="9" fill="#FBEADF" stroke="#D95F1E" stroke-width="1.8"/><text x="873" y="112" fill="#1e2430">L</text>
  </g>

  <!-- backward arrows -->
  <g stroke="#D95F1E" stroke-width="1.8" fill="none" marker-end="url(#bw)">
    <line x1="836" y1="168" x2="736" y2="168"/>
    <line x1="676" y1="168" x2="560" y2="168"/>
    <line x1="500" y1="168" x2="382" y2="168"/>
    <line x1="322" y1="168" x2="106" y2="168"/>
  </g>

  <!-- backward labels -->
  <g font-size="13" fill="#D95F1E" text-anchor="middle" font-style="italic">
    <text x="786" y="196">dL/dŷ = ŷ − y</text>
    <text x="618" y="196">dŷ/dz = σ′(z)</text>
    <text x="441" y="196">dz/d(Wx) = 1</text>
    <text x="214" y="196">d(Wx)/dW = xᵀ</text>
  </g>
  <g font-size="11.5" fill="#b08060" text-anchor="middle">
    <text x="214" y="214">← b와 유일하게 다른 지점</text>
  </g>

  <!-- result box -->
  <rect x="170" y="240" width="620" height="56" rx="10" fill="#FBEADF" stroke="#D95F1E" stroke-width="1.6"/>
  <text x="480" y="266" text-anchor="middle" font-size="14.5" font-style="italic" fill="#1e2430">dL/dW = (ŷ − y) · σ′(z) · xᵀ = δ xᵀ,   단 δ = dL/db</text>
  <text x="480" y="285" text-anchor="middle" font-size="11.5" fill="#8a5a3a">b까지 계산한 값을 그대로 재활용하고 마지막에 xᵀ만 곱해 주면 끝난다</text>

  <text x="480" y="324" text-anchor="middle" font-size="12.5" fill="#6b7280">그림 4. W에 대한 역전파 경로</text>
</svg>
