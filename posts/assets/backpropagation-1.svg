<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, -apple-system, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
    <marker id="a1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#177E5B"/>
    </marker>
  </defs>

  <rect width="780" height="380" rx="12" fill="#fbfaf7"/>

  <!-- column headers -->
  <g text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#1e2430">
      <text x="120" y="56">입력층</text>
      <text x="335" y="56">MLP 1층</text>
      <text x="520" y="56">활성화 함수 1층</text>
      <text x="675" y="56">출력층</text>
    </g>
    <g font-size="13" fill="#6b7280" font-style="italic">
      <text x="120" y="78">x ∈ ℝ³</text>
      <text x="335" y="78">z = Wx + b</text>
      <text x="520" y="78">a = σ(z)</text>
      <text x="675" y="78">ŷ = a</text>
    </g>
  </g>

  <!-- edges: input -> z -->
  <g stroke="#5a6472" stroke-width="1.4" fill="none" marker-end="url(#a1)">
    <line x1="148" y1="140" x2="303" y2="196"/>
    <line x1="150" y1="200" x2="303" y2="204"/>
    <line x1="148" y1="262" x2="303" y2="212"/>
    <line x1="368" y1="204" x2="488" y2="204"/>
    <line x1="552" y1="204" x2="643" y2="204"/>
  </g>
  <!-- bias edge -->
  <g stroke="#177E5B" stroke-width="1.4" fill="none" marker-end="url(#a1b)" stroke-dasharray="5 4">
    <line x1="290" y1="318" x2="330" y2="240"/>
  </g>

  <!-- weight labels -->
  <g font-size="12.5" fill="#3056C8" font-style="italic" text-anchor="middle">
    <text x="222" y="153">w₁</text>
    <text x="226" y="194">w₂</text>
    <text x="222" y="252">w₃</text>
  </g>

  <!-- nodes -->
  <g text-anchor="middle" font-size="15" font-style="italic">
    <circle cx="120" cy="130" r="28" fill="#E3EAFB" stroke="#3056C8" stroke-width="1.6"/><text x="120" y="136" fill="#1e2430">x₁</text>
    <circle cx="120" cy="204" r="28" fill="#E3EAFB" stroke="#3056C8" stroke-width="1.6"/><text x="120" y="210" fill="#1e2430">x₂</text>
    <circle cx="120" cy="278" r="28" fill="#E3EAFB" stroke="#3056C8" stroke-width="1.6"/><text x="120" y="284" fill="#1e2430">x₃</text>

    <circle cx="335" cy="204" r="33" fill="#ffffff" stroke="#5a6472" stroke-width="1.8"/><text x="335" y="210" fill="#1e2430">z</text>
    <circle cx="520" cy="204" r="33" fill="#ffffff" stroke="#5a6472" stroke-width="1.8"/><text x="520" y="210" fill="#1e2430">σ</text>
    <circle cx="675" cy="204" r="30" fill="#FBEADF" stroke="#D95F1E" stroke-width="1.8"/><text x="675" y="210" fill="#1e2430">ŷ</text>

    <rect x="248" y="308" width="46" height="34" rx="9" fill="#DFF2EA" stroke="#177E5B" stroke-width="1.6"/><text x="271" y="330" fill="#1e2430">b</text>
  </g>

  <!-- caption -->
  <text x="390" y="366" text-anchor="middle" font-size="12.5" fill="#6b7280">
    그림 1. 입력층 → MLP 1층 → 활성화 함수 1층 → 출력층으로 이루어진 모델. 학습 대상은 초록색 b와 파란색 W뿐이다.
  </text>
</svg>
